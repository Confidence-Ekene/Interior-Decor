    <script>
        const counters = document.querySelectorAll(".div2bi span");
        const countainer = document.querySelector(".div2bi");
        let activated = false;

        window.addEventListener("click", ()=>{
            if (activated === false) {
                counters.forEach(counter => {
                    counter.innerText = 0;

                    let count = 0;

                    function updateCount() {
                        const target = parseInt(counter.dataset.count);
                        if (count < target){
                            count++;
                            counter.innerText = count;
                            setTimeout(updateCount, 10);

                        } else{
                            counter.innerText = target;

                        }
                    }
                    updateCount()
                    activated = true
                })
            }
        })

        const images = ["images/images (1) (1).jpeg", "images/images2.jpeg", "images/images3.jpeg", "images/images4.jpeg" ];
        let currentIndex = 0;

        function changeImage(){
            currentIndex = (currentIndex +1)%
            images.length;

            document.getElementById("slideImg").src = images[currentIndex];
        }
        setInterval(changeImage, 3000)

        let canvas = document.getElementById("myCanvas");
      let context = canvas.getContext("2d");

      context.strokeStyle = "blue";
      context.beginPath();
      context.moveTo(0, 100);
      context.lineTo(100, 100);
      context.lineTo(105, 90);
    context.lineTo(110, 100);
     /*   context.lineTo(120, 80);
      context.lineTo(120, 80);
      context.lineTo(120, 80);
      context.lineTo(120, 80);
      context.lineTo(120, 80);*/

      context.stroke();
      
      let canvas4= document.getElementById("myCanvas4");
      let context4 = canvas4.getContext("2d");

      context4.fillStyle = "gray";
      context4.strokeStyle = "darkblue";
      context4.lineWidth = 5
      context4.beginPath();
      //context4.arc(0, 0, 50, 0, 2 * Math.PI);
     // context4.arc(50, 50, 25, 0, 2 * Math.PI);
      context4.arc(100, 100, 70, 0, 2 * Math.PI);
      context4.fillRect(0, 0, 50, 50);
      context4.stroke();
      context4.fill();
